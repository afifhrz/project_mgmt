{% extends 'base.html' %} {% load static %} {% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Project Assignment</h2>
    <button class="btn btn-info me-2">
      <a
        href="{% url 'projects:projects_detail' project.id %}"
        class="text-decoration-none text-white"
      >
        View Project →
      </a>
    </button>
  </div>
  <div class="row mb-3">
    <div class="col">
      <label class="mb-2">Project</label>
      <select class="form-select" id="projectSelect" required disabled>
        <option value="{{ project.id }}" selected>{{ project.name }}</option>
      </select>
    </div>
    <div class="col">
      <label class="mb-2">PIC</label>
      <select class="form-select" id="userSelect">
        {% for user in users %}
          <option value="{{ user.id }}">{{ user.get_full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-auto d-flex align-items-end">
      <button class="btn btn-success me-2" id="assignBtn">Assign</button>
    </div>
  </div>

  <div class="mt-4">
    <table id="assignmentTable" class="table table-bordered table-hover">
    </table>
  </div>
</div>
  
<!-- CSRF -->
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
  
{% endblock %} {% block script %}
<script src="{% static 'js/projects/projects_management.js' %}"></script>
{% endblock %}
