{% extends 'base.html' %} {% block content %}
<div class="container py-5">
  <h1 class="h4 fw-semibold mb-4">{{ project.name }}</h1>

  <div class="mb-3">
    <strong>Description:</strong>
    <p>{{ project.description }}</p>
  </div>

  <div class="mb-3">
    <strong>Created By:</strong>
    <p>{{ project.created_by.username }}</p>
  </div>

  <div class="mt-4">
    <a
      href="{% url 'projects:sprint_list' project.id %}"
      class="btn btn-success me-2"
      >View Sprints</a
    >
    <a href="{% url 'projects:delete' project.id %}" class="btn btn-danger me-2"
      >Delete Project</a
    >
    <a href="{% url 'projects:list' %}" class="btn btn-secondary"
      >Back to Project List</a
    >
  </div>
</div>
{% endblock %}
