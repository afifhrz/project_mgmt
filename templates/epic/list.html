{% extends 'base.html' %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Epics in {{ sprint.name }}</h1>

<div>
  <a href="{% url 'epic_create' sprint.id %}" class="bg-blue-500 text-white px-4 py-2 rounded">+ New Epic</a>
</div>

<div class="mt-4 space-y-4">
  {% for epic in epics %}
  <div class="bg-white p-4 rounded shadow">
    <h2 class="text-lg font-semibold">{{ epic.title }}</h2>
    <p>{{ epic.description }}</p>
    <div class="mt-2">
      <a href="{% url 'epic_update' epic.id %}" class="text-blue-500 hover:underline">Edit</a>
      <a href="{% url 'epic_delete' epic.id %}" class="text-red-500 hover:underline ml-4">Delete</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
