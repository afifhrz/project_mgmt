{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Management App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link href="{% static 'css/app.css' %}" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div
      class="d-flex justify-content-center align-items-center vh-100 bg-light"
    >
      <div class="card shadow p-4" style="width: 24rem">
        <h1 class="h4 text-center mb-4">Login</h1>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" required class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input
              type="password"
              name="password"
              required
              class="form-control"
            />
          </div>

          {% if form.errors %}
          <div class="alert alert-danger py-1 px-2 small mb-3" role="alert">
            Username or password incorrect
          </div>
          {% endif %}

          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </body>
</html>
