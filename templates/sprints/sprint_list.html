{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-6">
    <h2 class="text-2xl font-semibold mb-4">Sprints for {{ project.name }}</h2>

    <ul class="divide-y divide-gray-200">
    {% for sprint in sprints %}
        <li class="py-4">
        <div class="text-lg font-medium">{{ sprint.name }}</div>
        <div class="text-sm text-gray-500">
            {{ sprint.start_date }} to {{ sprint.end_date }}
        </div>
        <div class="flex gap-2">
            <button 
              hx-get="{% url 'projects:sprint_edit' sprint.id %}" 
              hx-target="#modal-content" 
              hx-trigger="click" 
              hx-swap="innerHTML"
              class="text-blue-600 hover:underline"
            >
              Edit
            </button>
            <button 
              hx-get="{% url 'projects:sprint_delete' sprint.id %}" 
              hx-target="#modal-content" 
              hx-trigger="click" 
              hx-swap="innerHTML"
              class="text-red-600 hover:underline"
            >
              Delete
            </button>
          </div>
        </li>
    {% empty %}
        <li class="py-4 text-gray-500">No sprints available for this project.</li>
    {% endfor %}
    </ul>
</div>
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50" x-data="{ open: false }" x-show="open" x-transition>
    <div class="bg-white rounded-lg p-6 w-full max-w-md" id="modal-content">
        <!-- HTMX will load content here -->
    </div>
</div>
  
<script>
document.body.addEventListener('htmx:afterSwap', (e) => {
    if (e.detail.target.id === "modal-content") {
    document.getElementById("modal").style.display = "flex";
    }
});

document.body.addEventListener('htmx:afterRequest', (e) => {
    if (e.detail.target.id === "modal-content" && e.detail.xhr.status === 204) {
    document.getElementById("modal").style.display = "none";
    location.reload();
    }
});
</script>
{% endblock %}
