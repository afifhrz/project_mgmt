<form method="post" hx-post="{% url 'projects:sprint_edit' object.id %}" hx-target="#modal-content" hx-swap="innerHTML">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex justify-end gap-2 mt-4">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
      <button type="button" onclick="document.getElementById('modal').style.display='none'" class="text-gray-600">Cancel</button>
    </div>
</form>
