<div class="modal-header">
  <h5 class="modal-title" id="sprintModalLabel">Edit Sprint</h5>
  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="modal"
    aria-label="Close"
  ></button>
</div>
<div class="modal-body">
  <form method="post" id="sprintUpdateForm" action="{% url 'projects:sprints_edit' sprint.id %}">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" />
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input
        type="text"
        class="form-control"
        id="name"
        name="name"
        value="{{ sprint.name }}"
        required
      />
    </div>
    <div class="mb-3">
      <label for="start_date" class="form-label">Start Date</label>
      <input
        type="date"
        class="form-control"
        id="start_date"
        name="start_date"
        value="{{ sprint.start_date|date:'Y-m-d' }}"
        required
      />
    </div>
    <div class="mb-3">
      <label for="end_date" class="form-label">End Date</label>
      <input
        type="date"
        class="form-control"
        id="end_date"
        name="end_date"
        value="{{ sprint.end_date|date:'Y-m-d' }}"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary">Update Sprint</button>
  </form>
</div>
