<!-- templates/tasks/_create_task_modal.html -->
<div
  class="modal fade"
  id="createTaskModal"
  tabindex="-1"
  aria-labelledby="createTaskModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="createTaskForm" data-url="{% url 'tasks:tasks_create' %}">
        {% csrf_token %}

        <!-- header -->
        <div class="modal-header">
          <h5 class="modal-title" id="createTaskModalLabel">Create Task</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <!-- body -->
        <div class="modal-body">
          <input type="hidden" name="seven_day_id" value="{{ seven_day.id }}" />

          <!-- ─── Basic info ─────────────────────────────────────────────── -->
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="rmu">RMU</label>
              <select class="form-select" id="rmu" name="rmu" required>
                {% for value, label in rmu_choices %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
              <label class="form-label mt-1" for="section">Section</label>
              <select class="form-select" id="section" name="section" required>
                {% for value, label in section_choices %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="taskname">Task name</label>
              <textarea
                class="form-control"
                id="taskname"
                name="taskname"
                rows="4"
                required
              ></textarea>
            </div>
          </div>

          <!-- ─── Plan dates & duration ─────────────────────────────────── -->
          <div class="row g-3 mt-3">
            <div class="col-md-3">
              <label class="form-label" for="planStart">Plan start</label>
              <input
                type="date"
                class="form-control"
                id="planStart"
                name="plan_start_date"
                required
              />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="planEnd">Plan end</label>
              <input
                type="date"
                class="form-control"
                id="planEnd"
                name="plan_end_date"
                required
              />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="workDuration"
                >Planned work (hrs)</label
              >
              <input
                type="number"
                class="form-control"
                id="workDuration"
                name="planned_work_duration"
                min="0"
                required
              />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="manpower">Planned manpower</label>
              <input
                type="number"
                class="form-control"
                id="manpower"
                name="planned_manpower"
                min="0"
                required
              />
            </div>
          </div>

          <!-- ─── Flags ──────────────────────────────────────────────────── -->
          <div class="row g-3 mt-3 ms-1 justify-content-between">
            <div class="col-md-3 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="breakIn"
                name="break_in"
              />
              <label class="form-check-label" for="breakIn">Break-in</label>
            </div>
            <div class="col-md-3 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="needCont"
                name="need_contingency"
              />
              <label class="form-check-label" for="needCont"
                >Need contingency</label
              >
            </div>
            <div class="col-md-3 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="workPack"
                name="work_pack_readiness"
                checked
              />
              <label class="form-check-label" for="workPack"
                >Work-pack ready</label
              >
            </div>
          </div>

          <!-- ─── Location & remarks ─────────────────────────────────────── -->
          <div class="row g-3 mt-3">
            <div class="col-md-6">
              <label class="form-label" for="location">Location</label>
              <textarea
                class="form-control"
                id="location"
                name="location"
                rows="2"
              ></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="remarks">Remarks</label>
              <textarea
                class="form-control"
                id="remarks"
                name="remarks"
                rows="2"
              ></textarea>
            </div>
          </div>

          <!-- ─── Risk ───────────────────────────────────────────────────── -->
          <fieldset class="border rounded-3 p-3 mt-4">
            <legend class="float-none w-auto px-2 fs-6">Risk</legend>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label" for="riskLikelihood"
                  >Likelihood</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="riskLikelihood"
                  name="risk_likelihood"
                  min="0"
                  max="5"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label" for="riskImpact">Impact</label>
                <input
                  type="number"
                  class="form-control"
                  id="riskImpact"
                  name="risk_impact"
                  min="0"
                  max="5"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label" for="ptwRisk">PTW based on RL</label>
                <select
                  class="form-select"
                  id="ptwRisk"
                  name="ptw_based_on_risk_level"
                  required
                >
                  {% for value, label in ptw_choices %}
                  <option value="{{ value }}">{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </fieldset>

          <!-- ─── Priority ──────────────────────────────────────────────── -->
          <fieldset class="border rounded-3 p-3 mt-4">
            <legend class="float-none w-auto px-2 fs-6">Priority</legend>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="priorityUrgency">Urgency</label>
                <input
                  type="number"
                  class="form-control"
                  id="priorityUrgency"
                  name="priority_urgency"
                  min="0"
                  max="5"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="priorityImpact">Impact</label>
                <input
                  type="number"
                  class="form-control"
                  id="priorityImpact"
                  name="priority_impact"
                  min="0"
                  max="5"
                  required
                />
              </div>
            </div>
          </fieldset>

          <!-- ─── Budget ────────────────────────────────────────────────── -->
          <div class="row g-3 mt-4">
            <div class="col-md-6">
              <label class="form-label" for="budgetPlan"
                >Budgetary planning ($)</label
              >
              <input
                type="number"
                step="0.01"
                class="form-control"
                id="budgetPlan"
                name="budgetary_planning"
                min="0"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="budgetActual"
                >Budgetary actual ($)</label
              >
              <input
                type="number"
                step="0.01"
                class="form-control"
                id="budgetActual"
                name="budgetary_actual"
                min="0"
              />
            </div>
          </div>
          <!-- ─── Assigned to ───────────────────────────────────────────── -->
          <div class="row g-3 mt-3">
            <div class="col-md-6">
              <label class="form-label d-block mb-2"
                >PIC (select one or more)</label
              >

              <div
                class="border rounded p-2"
                style="max-height: 14rem; overflow-y: auto"
              >
                {% for user in pics %}
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    name="pic_ids"
                    id="pic{{ user.id }}"
                    value="{{ user.id }}"
                  />
                  <label class="form-check-label" for="pic{{ user.id }}">
                    {{ user.get_full_name }}
                  </label>
                </div>
                {% empty %}
                <p class="text-muted small mb-0">No users available.</p>
                {% endfor %}
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="status">Status</label>
              <select class="form-select" id="status" name="status" required>
                {% for value, label in status_choices %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <!-- unattained reason (optional, only shows if status ≠ OPEN) -->
          <div class="mt-3" id="unattainedWrapper" style="display: none">
            <label class="form-label" for="unattainedReason"
              >Unattained reason</label
            >
            <textarea
              class="form-control"
              id="unattainedReason"
              name="unattained_reason"
              rows="2"
            ></textarea>
          </div>
        </div>

        <!-- footer -->
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>
</div>
