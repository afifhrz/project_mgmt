{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
  <div class="container d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 fw-bold">{{ seven_day.project.name }} - 7D Board</h1>
    <div>
      <a href="{% url 'projects:seven_days_list' seven_day.project.id %}" class="btn btn-outline-info">
        🔙 Back to 7D List
      </a>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createTaskModal" id="openCreateTaskModal">
        + Create Task
      </button>
    </div>
  </div>
  {% include "tasks/_task_table.html" %}
</div>

{% include "tasks/_create_task_modal.html" %}
{% endblock %}

{% block script %}
<script src="{% static 'js/tasks.js' %}"></script>
<script src="{% static 'js/tasks/_task_table.js' %}"></script>
{% endblock %}
