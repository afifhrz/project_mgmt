<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found - 404</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #f8fafc;
            color: #22223b;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px 30px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(34, 34, 59, 0.08);
        }
        h1 {
            font-size: 5rem;
            margin: 0 0 10px 0;
            color: #4f8ef7;
        }
        h2 {
            font-size: 2rem;
            margin: 0 0 20px 0;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            padding: 10px 24px;
            background: #4f8ef7;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        a:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you are looking for does not exist or has been moved.</p>
        <a href="{% url 'home' %}">Go to Homepage</a>
    </div>
</body>
</html>
